version: '3.8'

# Susunan lama untuk satu mesin (EC2). Untuk Railway pakai Dockerfile langsung, tanpa berkas ini.
# Pemroses antrean (worker) BUKAN bagian dari image backend: kodenya ada di ../worker dengan Dockerfile sendiri
# (`node dist/worker.js`). Backend hanya memasukkan pekerjaan ke tabel automation_queue.
# Redis tidak dipakai lagi (queue memakai database), jadi tidak ada layanan Redis di sini.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
    restart: unless-stopped
    networks:
      - applify-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - applify-network

networks:
  applify-network:
    driver: bridge
