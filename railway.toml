# Konfigurasi Railway untuk service backend (config as code). Railway menyuntikkan PORT; server mendengarkan 0.0.0.0:$PORT.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
